<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="styles.css">

  <title>Blog Preview Card - Challenge 1</title>

</head>
<body>

  <section class="hero">
    <div class="card">
      <div class="card-content">
        <img src="assets/images/illustration-article.svg" alt="" class="card-image">
        <div class="card-text">
          <h1 class="card-learning-h">Learing</h1>
          <p class="card-published-p">Published 21 Dec 2025</p>
          <h1 class="card-foundations-h">HTML & CSS foundations</h1>
          <p class="card-p">These languages are the backbone of every website, defining strucutre, content, and presentation.</p>
          <div class="card-author">
            <img src="assets/images/image-avatar.webp" alt="" class="card-icon">
            <h1>Greg Hooper</h1>
          </div> 
        </div>
      </div>
      
    </div>
  </section>

</body>
</html>
